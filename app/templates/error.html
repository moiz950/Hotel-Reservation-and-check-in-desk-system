<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ code }} &middot; {{ title }} &middot; {{ settings.get('hotel_name', 'Hotel') }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/public.css') }}">
</head>
<body class="error-page-body">
    <div class="error-page">
        <div class="error-card">
            <span class="error-code">{{ code }}</span>
            <h1>{{ title }}</h1>
            <p>{{ message }}</p>
            <div class="error-actions">
                <a href="{{ url_for('public.home') }}" class="btn btn-gold">Back to Home</a>
                <a href="{{ url_for('public.contact') }}" class="btn btn-outline">Contact Us</a>
            </div>
        </div>
    </div>
</body>
</html>
